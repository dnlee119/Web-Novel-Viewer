<wn-story schema-version="1" title="첫차가 오는 시간" lang="ko">
  <wn-group id="platform" title="빈 승강장" scroll-vh="120" auto-ms="8000">
    <wn-image id="platform-image" src="./images/dawn-platform.webp" alt="새벽빛이 비치는 빈 승강장과 문이 열린 첫차" x="0" y="0" width="55%" height="100%"></wn-image>
    <wn-text id="platform-opening" x="61%" y="19%" width="33%" font-size="1.85rem">새벽의 승강장은 아직 아무에게도 이름을 불리지 않은 것처럼 <strong>조용했다.</strong></wn-text>
    <wn-text id="platform-detail" x="61%" y="58%" width="33%" show-from="0.18" enter="fade">그는 첫차가 들어서기 전까지 늘 같은 자리에 서 있었다. 어둠 속에서 레일이 먼저 빛나는 것을 좋아했다.</wn-text>
    <wn-audio id="platform-chime" title="승강장의 종소리" src="./media/platform-chime.wav" role="music" x="61%" y="82%" width="33%"></wn-audio>
  </wn-group>
  <wn-group id="door" title="열린 문" scroll-vh="98" auto-ms="6500">
    <wn-text id="door-opening" kind="sentence" x="7%" y="24%" width="37%" font-size="2rem">첫차는 소리보다 <em>빛을</em> 먼저 데려왔다.</wn-text>
    <wn-text id="door-detail" x="7%" y="62%" width="37%" show-from="0.15" enter="slide">문이 열렸다. 그는 한 박자 늦게 발을 옮겼다. 그제야 어제와 다른 하루가 시작됐다.</wn-text>
    <wn-image id="door-image" src="./images/dawn-platform.webp" alt="정차한 첫차 객실에서 승강장으로 새어 나오는 불빛" x="51%" y="0" width="49%" height="100%"></wn-image>
  </wn-group>
</wn-story>
